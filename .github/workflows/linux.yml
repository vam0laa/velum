# Builds Velum on Linux and packs it into one AppImage file.
# The release is signed and published from the maintainer's computer (scripts/release.sh),
# so no signing secret is ever stored here.
name: linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0-beta.2"
        required: true
      engine_run:
        description: "Run of engine.yml whose patched Qt WebEngine to pack (empty: Qt's own)"
        required: false
      engine_sha:
        description: "SHA-256 of that run's engine archive (needed with engine_run)"
        required: false

permissions:
  contents: read
  actions: read # to fetch the engine from an engine.yml run

jobs:
  build:
    # an old system on purpose: the result runs on this one and anything newer
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version
        id: version
        env:
          ASKED: ${{ github.event.inputs.version }}
        run: |
          v="$ASKED"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo "bad version: $v"; exit 1; }
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ninja-build libssl-dev libsecret-1-dev libfuse2 file \
              libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libnss3 libasound2 \
              libxkbfile1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgbm1 libfontconfig1 libdbus-1-3 \
              libcups2 libpulse0 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: "6.12.1"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: "qtwebchannel qtpositioning qtshadertools"
          cache: true

      # from Qt 6.12 the engine comes on its own; the script checks its sum
      - name: Qt WebEngine
        if: ${{ !github.event.inputs.engine_run }}
        shell: bash
        run: python3 scripts/fetch-webengine.py linux "$QT_ROOT_DIR"

      # Velum's patched engine (patches/), as built by engine.yml
      - name: Qt WebEngine, patched
        if: ${{ github.event.inputs.engine_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.inputs.engine_run }}
          SHA: ${{ github.event.inputs.engine_sha }}
        run: |
          [[ "$RUN" =~ ^[0-9]+$ && "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "engine_run and engine_sha are needed"; exit 1; }
          # libraries this engine takes from the system, which Qt's own build carries inside
          sudo apt-get install -yq libsnappy1v5 liblcms2-2
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name velum-webengine --dir "$RUNNER_TEMP/engine"
          file="$RUNNER_TEMP/engine/velum-webengine-6.140.0-linux.tar.xz"
          echo "$SHA  $file" | sha256sum -c -
          tar -C "$QT_ROOT_DIR" -xJf "$file"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          "-DVELUM_RELEASE=${{ steps.version.outputs.value }}"

      # the updater compares this number: a wrong one would reinstall for ever
      - name: Check the version
        run: grep -x "VELUM_RELEASE:STRING=${{ steps.version.outputs.value }}" build/CMakeCache.txt

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure -E ui

      - name: AppImage
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build
          sed -i 's|^Exec=.*velum|Exec=velum|' AppDir/usr/share/applications/velum.desktop
          mkdir tools out
          base=https://github.com/linuxdeploy
          curl -sSfL -o tools/linuxdeploy $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSfL -o tools/linuxdeploy-plugin-qt $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools/*
          export PATH="$PWD/tools:$PATH"
          export QMAKE="$(command -v qmake)" QML_SOURCES_PATHS="$PWD/qml" LD_LIBRARY_PATH="$QT_ROOT_DIR/lib"
          plugins="$QT_ROOT_DIR/plugins"
          # only SQLite is used; the other database drivers want libraries nobody has
          find "$plugins/sqldrivers" -type f ! -name libqsqlite.so -delete
          # a plugin that wants a library which is not here (serial GPS and the like) stays out
          find "$plugins" -name '*.so' | while read -r so; do
              if ldd "$so" | grep -q 'not found'; then echo "left out: ${so#$plugins/}"; rm "$so"; fi
          done
          export EXTRA_PLATFORM_PLUGINS="$(cd $plugins/platforms && ls libqwayland*.so libqoffscreen.so | paste -sd';')"
          export EXTRA_QT_PLUGINS="$(cd $plugins && ls -d wayland-* imageformats tls networkinformation 2>/dev/null | paste -sd';')"
          export LDAI_OUTPUT="out/Velum-$VERSION-x86_64.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          # NSS opens these by itself, so no tool finds them. Without them the packed NSS
          # loads the system's, of another version, and the program dies at start.
          nss=()
          for so in /usr/lib/x86_64-linux-gnu/nss/*.so; do nss+=(--library "$so"); done
          [ ${#nss[@]} -gt 0 ]
          linuxdeploy --appdir AppDir "${nss[@]}" --plugin qt
          # The Qt plugin leaves out what draws with the graphics card on Wayland; without
          # it Velum cannot open a window there.
          cp -r "$plugins/wayland-graphics-integration-client" AppDir/usr/plugins/
          test -f AppDir/usr/plugins/wayland-graphics-integration-client/libqt-plugin-wayland-egl.so
          # The system's FreeType brings the system's libbrotlidec along; with the packed, older
          # libbrotlicommon beside it the page process cannot start. Use the system's pair.
          rm -f AppDir/usr/lib/libbrotli*
          linuxdeploy --appdir AppDir --exclude-library 'libbrotli*' --deploy-deps-only AppDir/usr/plugins/wayland-graphics-integration-client --output appimage
          if ls AppDir/usr/lib/libbrotli* 2>/dev/null; then echo "brotli was packed again"; exit 1; fi
          # whatever the engine needs beyond the basic system must be inside
          if [ -n "${{ github.event.inputs.engine_run }}" ]; then
              test -f AppDir/usr/lib/libsnappy.so.1
              test -f AppDir/usr/lib/liblcms2.so.2
          fi

      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # the packed program must start and draw its window without the build's Qt
          env -i HOME="$(mktemp -d)" PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
              QT_QUICK_BACKEND=software VELUM_NO_UPDATES=1 QT_FORCE_STDERR_LOGGING=1 \
              timeout 90 "$PWD/out/Velum-$VERSION-x86_64.AppImage" --screenshot "$PWD/smoke.png" 2> smoke.log \
              || { cat smoke.log; exit 1; }
          cat smoke.log
          test -s smoke.png
          ! grep -E "Cannot load font|TypeError|ReferenceError|is not installed|symbol lookup error|error while loading shared libraries" smoke.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: velum-linux
          path: out/*.AppImage
          if-no-files-found: error

  # A newer system of another family: what the build system lends does not hide a gap here.
  elsewhere:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: velum-linux
          path: files
      - name: Start on Arch Linux, without a screen and under Wayland
        run: |
          chmod +x files/*.AppImage
          cat > files/try.sh <<'EOS'
          set -eu
          app=$(ls /files/*.AppImage)
          export APPIMAGE_EXTRACT_AND_RUN=1 VELUM_NO_UPDATES=1 QT_FORCE_STDERR_LOGGING=1 QTWEBENGINE_CHROMIUM_FLAGS=--no-sandbox
          cd /tmp
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 90 "$app" --screenshot /tmp/plain.png https://example.com 2> plain.log || { cat plain.log; exit 1; }
          cat plain.log
          test -s /tmp/plain.png
          # the page process is a program of its own: a library that does not fit shows only here
          ! grep -E "symbol lookup error|error while loading shared libraries" plain.log
          # a real Wayland compositor, drawing in memory: the window must come up with OpenGL
          export XDG_RUNTIME_DIR=/tmp/run LIBGL_ALWAYS_SOFTWARE=1
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=gl --socket=wl-test --idle-time=0 > weston.log 2>&1 &
          for i in $(seq 40); do [ -S "$XDG_RUNTIME_DIR/wl-test" ] && break; sleep 0.5; done
          [ -S "$XDG_RUNTIME_DIR/wl-test" ] || { cat weston.log; exit 1; }
          WAYLAND_DISPLAY=wl-test QT_QPA_PLATFORM=wayland timeout 90 "$app" --screenshot /tmp/wayland.png 2> velum.log || { cat velum.log weston.log; exit 1; }
          cat velum.log
          test -s /tmp/wayland.png
          ! grep -E "Failed to initialize graphics|Failed to create RHI|Could not load the Qt platform plugin|symbol lookup error|error while loading shared libraries" velum.log
          EOS
          docker run --rm -v "$PWD/files:/files:ro" archlinux:latest bash -c '
              pacman -Syu --noconfirm --needed nss alsa-lib libxkbcommon-x11 libxcomposite libxdamage libxrandr libxtst libxkbfile fontconfig mesa libglvnd dbus wayland weston >/dev/null &&
              useradd -m u && su u -c "bash /files/try.sh"'

  # The AppImage is also put into a draft release of this (private) repository, which only
  # the maintainer sees: scripts/release.sh fetches it from there.
  store:
    # a trial branch must not replace the build waiting to be released
    if: github.ref == 'refs/heads/main'
    needs: [build, elsewhere]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: velum-linux
          path: files
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isDraft --jq '.[] | select(.isDraft and (.tagName | startswith("linux-build-"))) | .tagName' |
              while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes; done
          gh release create "linux-build-$GITHUB_RUN_ID" files/* --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "Linux build $GITHUB_RUN_ID" --notes "Unsigned build output. Not for use."
