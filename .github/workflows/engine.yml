# Builds Qt WebEngine with Velum's patch (patches/), in stretches that follow one another.
name: engine

on:
  push:
    branches: [qt-6.12.1-upgrade]
    paths: ["patches/**", ".github/workflows/engine*.yml"]

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage1:
    uses: ./.github/workflows/engine-stage.yml
    with:
      stage: 1
  stage2:
    needs: stage1
    if: needs.stage1.outputs.done == 'false'
    uses: ./.github/workflows/engine-stage.yml
    with:
      stage: 2
  stage3:
    needs: stage2
    if: needs.stage2.outputs.done == 'false'
    uses: ./.github/workflows/engine-stage.yml
    with:
      stage: 3
  stage4:
    needs: stage3
    if: needs.stage3.outputs.done == 'false'
    uses: ./.github/workflows/engine-stage.yml
    with:
      stage: 4
  stage5:
    needs: stage4
    if: needs.stage4.outputs.done == 'false'
    uses: ./.github/workflows/engine-stage.yml
    with:
      stage: 5
