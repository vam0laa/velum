# One stretch of building the patched Qt WebEngine. A hosted job may run six hours and the
# engine takes longer, so each stretch leaves what it compiled in a cache for the next one.
name: engine stage

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: number
    outputs:
      done:
        value: ${{ jobs.build.outputs.done }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    outputs:
      done: ${{ steps.build.outputs.done }}
    env:
      CCACHE_DIR: /home/runner/ccache
      CCACHE_MAXSIZE: 8G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make room
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          sudo fallocate -l 8G /extra-swap && sudo chmod 600 /extra-swap && sudo mkswap -q /extra-swap && sudo swapon /extra-swap
          df -h /

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ninja-build ccache g++-12 gperf bison flex python3-html5lib \
              libgl1-mesa-dev libegl1-mesa-dev libgbm-dev libdrm-dev libva-dev libvulkan-dev \
              libnss3-dev libdbus-1-dev libfontconfig1-dev libfreetype-dev libasound2-dev libpulse-dev \
              libcups2-dev libpci-dev libudev-dev libsnappy-dev libkrb5-dev libcap-dev \
              libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libxcomposite-dev libxcursor-dev \
              libxdamage-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev libxss-dev \
              libxtst-dev libxshmfence-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: "6.12.1"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: "qtwebchannel qtpositioning qtshadertools"
          cache: true

      - name: Engine source, with Velum's patch
        run: |
          git clone -q --depth 1 --branch v6.140.0 https://github.com/qt/qtwebengine.git ../engine
          test "$(git -C ../engine rev-parse HEAD)" = e081473af432e2b09d17caa3ca3bffd45992a0bd
          git -C ../engine submodule update -q --init --depth 1
          cat ../engine/CHROMIUM_VERSION
          grep -q '157\.0\.8103\.50' ../engine/CHROMIUM_VERSION
          git -C ../engine apply --verbose "$GITHUB_WORKSPACE"/patches/qtwebengine-6.140.0-refresh-rate.patch
          df -h /

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/ccache
          key: engine-6.140.0-${{ github.run_id }}-${{ inputs.stage }}
          restore-keys: engine-6.140.0-

      # the features are those of Qt's own build, so that ours can take its place
      - name: Configure
        run: |
          mkdir ../engine-build && cd ../engine-build
          CC=gcc-12 CXX=g++-12 "$QT_ROOT_DIR/bin/qt-cmake" -S ../engine -B . -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DQT_BUILD_QTPDF=OFF -DFEATURE_qtpdf_build=OFF \
              -DFEATURE_webengine_proprietary_codecs=OFF -DFEATURE_webengine_webrtc_pipewire=OFF -DFEATURE_webengine_kerberos=OFF \
              -DFEATURE_webengine_native_spellchecker=OFF -DFEATURE_webengine_vaapi=ON -DFEATURE_webengine_vulkan=ON 2>&1 | tee configure.log
          if grep -q 'QtWebEngine will not be built' configure.log; then exit 1; fi

      - name: Build
        id: build
        run: |
          cd ../engine-build
          ( while sleep 900; do echo "== $(date -u +%T)"; df -h / | tail -1; free -g | sed -n 2,3p; ccache -s | head -6; done ) &
          watch=$!
          rc=0
          timeout --signal=INT --kill-after=120 265m cmake --build . --parallel 4 > build.log 2>&1 || rc=$?
          kill $watch
          tail -40 build.log; ccache -s; df -h /; du -sh . "$CCACHE_DIR"
          if [ $rc = 0 ]; then
              cmake --install . --prefix "$GITHUB_WORKSPACE/engine-out"
              echo done=true >> "$GITHUB_OUTPUT"
          elif [ $rc = 124 ] || [ $rc = 137 ]; then
              echo "time is up, the next stage goes on"
              echo done=false >> "$GITHUB_OUTPUT"
          else
              grep -n -m20 -B3 -A12 -E 'FAILED:|error:' build.log; exit $rc
          fi

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: /home/runner/ccache
          key: engine-6.140.0-${{ github.run_id }}-${{ inputs.stage }}

      # also as notes on the run: those can be read where the log files cannot be fetched
      - name: Say what happened
        if: always()
        run: |
          note() { # level title file
              body=$(head -c 3800 "$3" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              [ -z "$body" ] || echo "::$1 title=$2::$body"
          }
          cd ../engine-build 2>/dev/null || exit 0
          grep -nE -A3 'CMake (Error|Warning)|will not be built|Dependency check failed|^ *ERROR' configure.log > n1 || true
          note notice "configure problems" n1
          sed -n '/Configure summary/,$p' configure.log | grep -iE 'webengine|build ' > n2 || true
          note notice "configure summary" n2
          grep -iE 'Performing Test.*(webengine|gcc|glibc|compiler).*Fail|not found|Could NOT|missing|required|requires|Checking for.*no$' configure.log > n5 || true
          note notice "configure missing" n5
          tail -60 configure.log > n6 || true
          note notice "configure tail" n6
          if [ "${{ job.status }}" = failure ]; then
              grep -nE -m12 -B2 -A8 'FAILED:|error:|Error ' build.log > n3 || true
              note error "build errors" n3
              tail -30 build.log > n4 || true
              note error "build tail" n4
          fi

      # artifacts may only come from inside the workspace
      - name: Collect the logs
        if: always()
        run: mkdir -p engine-logs && cp ../engine-build/*.log engine-logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: engine-logs-${{ inputs.stage }}
          path: engine-logs/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Pack
        if: steps.build.outputs.done == 'true'
        run: tar -C engine-out -cJf velum-webengine-6.140.0-linux.tar.xz .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.build.outputs.done == 'true'
        with:
          name: velum-webengine
          path: velum-webengine-6.140.0-linux.tar.xz
          retention-days: 14
